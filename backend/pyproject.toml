[project]
name = "equalise-backend"
version = "0.1.0"
description = "EQUALISE Egypt — AI-Powered Legal Simulation Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "openai>=1.55",
    "jinja2>=3.1",
    "weasyprint>=63",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# E501: long lines — covered by formatter, not blocker.
# UP042: prefers `enum.StrEnum` over `(str, Enum)`. Mechanical change but
#        str(MyEnum.FOO) behavior differs; revisit when auth lands.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures imported from sibling test modules legitimately
# trigger F401 (unused import) and F811 (redefinition) — that's the
# canonical pattern for sharing fixtures via re-export.
"tests/*" = ["F401", "F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
