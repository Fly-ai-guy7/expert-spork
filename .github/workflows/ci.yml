name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest (with coverage gate)
        env:
          # Tests use SQLite in-memory; no real keys required.
          EQUALISE_ENV: development
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=80

  frontend:
    name: Frontend (lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Tests
        run: npm test -- --run

      - name: Build (catches TS strict errors)
        run: npm run build

      - name: Bundle budget (250 KB gz initial)
        run: node scripts/check-bundle-size.mjs

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cve-scan:
    name: Dependency CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ./backend
          pip-audit --strict --ignore-vuln GHSA-none || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --omit=dev || true

  migrations:
    name: Alembic roundtrip (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equalise
          POSTGRES_PASSWORD: equalise
          POSTGRES_DB: equalise
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U equalise" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
      - name: Apply all migrations, then roundtrip the latest
        env:
          DATABASE_URL: postgresql+psycopg://equalise:equalise@localhost:5432/equalise
        run: |
          # All upgrades must apply cleanly on real Postgres (catches
          # JSONB/enum issues SQLite tests miss).
          alembic upgrade head
          # The most recent migration must be reversible.
          alembic downgrade -1
          alembic upgrade head

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Long-running browser flow — gate it on a label to keep PRs fast.
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e') || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equalise
          POSTGRES_PASSWORD: equalise
          POSTGRES_DB: equalise
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U equalise" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
      - name: Start backend + worker
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://equalise:equalise@localhost:5432/equalise
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          JWT_SECRET: e2e-test-secret-not-for-production-use-only
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.E2E_DEEPSEEK_API_KEY }}
        run: |
          alembic upgrade head
          python -m app.corpus_loader
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          celery -A app.workers.celery_app worker --loglevel=info &
          # Wait for /readyz
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz; then break; fi
            sleep 2
          done
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Build + serve frontend
        working-directory: frontend
        env:
          VITE_API_BASE: http://localhost:8000
        run: |
          npm run build
          npx vite preview --host 0.0.0.0 --port 5173 &
          sleep 5
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_BASE: http://localhost:8000
        run: npm run e2e
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  infra-lint:
    name: Helm + Terraform lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: helm lint
        run: helm lint infra/helm/equalise
      - name: helm template (renders cleanly)
        run: helm template equalise infra/helm/equalise > /dev/null
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

  docker-build:
    name: Docker build (prod images)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend prod target
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Caddy edge (frontend SPA + proxy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
