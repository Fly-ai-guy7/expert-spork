services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SPORK_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - SPORK_LOG_JSON=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
