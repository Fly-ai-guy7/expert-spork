# Fly.io config — Coral Crest Residences (white-label demo).
# Deploy with the helper from the aise-rooms/ directory:
#   ./deploy-demo.sh coral-crest

app = "coral-crest-rooms"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
