# Fly.io config for AISE Rooms — static single-file app served by nginx.
# Generic AISE deployment target: rooms.aise.app
#
# First-time setup:
#   fly launch --no-deploy --copy-config --name aise-rooms
#   fly certs add rooms.aise.app        # then point DNS at the app
#   fly deploy
#
# Per-hotel white-label: copy this directory, edit AISE_CONFIG in index.html,
# change `app` below to e.g. "arena-beach-rooms", and `fly deploy`.

app = "aise-rooms"
primary_region = "lhr"   # London — matches the AISE stack

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
