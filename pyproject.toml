[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expert-spork"
version = "0.1.0"
description = "AI inference platform — built in Hurghada, Egypt"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Expert Spork AI", email = "eng@expertspork.ai" },
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "structlog>=24.4,<25",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "pre-commit>=4.0,<5",
    "mypy>=1.13,<2",
]
ml = [
    "torch>=2.4,<3",
    "transformers>=4.46,<5",
    "safetensors>=0.4,<1",
    "accelerate>=1.1,<2",
]

[project.scripts]
serve = "expert_spork.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/expert_spork"]

# ── Ruff ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["expert_spork"]

# ── Pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

# ── Mypy ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "safetensors.*", "accelerate.*"]
ignore_missing_imports = true

# ── Coverage ─────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["expert_spork"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]
